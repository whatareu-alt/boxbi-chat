# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8081

# ─── Database (PostgreSQL in prod, H2 in local dev) ──────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

# H2 console: NEVER enable in production.
# To enable locally, create src/main/resources/application-local.properties with:
#   spring.h2.console.enabled=true
spring.h2.console.enabled=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
# REQUIRED: set JWT_SECRET env var in production (minimum 32 random characters).
# Example: export JWT_SECRET=$(openssl rand -hex 32)
jwt.secret=${JWT_SECRET:boxbi-messenger-super-secret-key-change-this-in-production-2024}
jwt.expiration=86400000

# ─── Security headers ─────────────────────────────────────────────────────────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
