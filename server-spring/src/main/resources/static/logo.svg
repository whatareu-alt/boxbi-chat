<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a4144b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff4d8d;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
            <feOffset dx="0" dy="10" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background Shape (Rounded Box) -->
    <rect width="440" height="440" x="36" y="36" rx="100" fill="url(#logo-gradient)" filter="url(#shadow)"/>
    
    <!-- Box Bottom Part -->
    <path d="M256 380 L390 310 V230 L256 300 L122 230 V310 Z" fill="#ffffff" />
    <path d="M122 310 L256 380 V300 L122 230 Z" fill="#f0f0f0" />
    
    <!-- Box Flaps -->
    <path d="M256 300 L390 230 L340 160 L206 230 Z" fill="#ffffff" />
    <path d="M256 300 L122 230 L172 160 L306 230 Z" fill="#ffffff" />
    <path d="M172 160 L306 230 L360 200 L226 130 Z" fill="#e0e0e0" opacity="0.6"/>
    
    <!-- Chat Bubbles inside box -->
    <circle cx="230" cy="240" r="25" fill="#a4144b" />
    <circle cx="220" cy="240" r="3" fill="white" />
    <circle cx="230" cy="240" r="3" fill="white" />
    <circle cx="240" cy="240" r="3" fill="white" />
    
    <circle cx="280" cy="200" r="20" fill="#a4144b" />
    <circle cx="273" cy="200" r="2" fill="white" />
    <circle cx="280" cy="200" r="2" fill="white" />
    <circle cx="287" cy="200" r="2" fill="white" />
    
    <!-- Paper Plane -->
    <g transform="translate(340, 150) rotate(-15) scale(0.6)">
        <path d="M0 50 L100 0 L40 60 L0 50 Z" fill="white" />
        <path d="M100 0 L60 100 L40 60 L100 0 Z" fill="#f0f0f0" />
        <path d="M40 60 L60 100 L60 60 L40 60 Z" fill="#a4144b" />
    </g>
</svg>
