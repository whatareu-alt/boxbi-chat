<svg viewBox="0 0 512 600"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#db707a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#c54a5c;stop-opacity:1" />
        </linearGradient>
        <filter id="glass-gloss" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
            <feOffset dx="0" dy="8" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background Shape (Icon Box) -->
    <rect width="400" height="400" x="56" y="20" rx="100" fill="url(#logo-gradient)" filter="url(#glass-gloss)"/>

    <!-- Glossy Overlay -->
    <path d="M156 20 Q 56 20 56 130 L 56 280 Q 256 180 456 280 L 456 130 Q 456 20 356 20 Z" fill="white" opacity="0.1"/>

    <!-- Box Structure (Main white icon) -->
    <g transform="translate(130, 140) scale(1.0)">
        <!-- Bottom -->
        <path d="M130 180 L260 120 V50 L130 110 L0 50 V120 Z" fill="#ffffff" />
        <path d="M0 120 L130 180 V110 L0 50 Z" fill="#f8f8f8" />

        <!-- Flaps -->
        <path d="M130 110 L260 50 L210 -10 L80 50 Z" fill="#ffffff" />
        <path d="M130 110 L0 50 L50 -10 L180 50 Z" fill="#ffffff" />
        <path d="M50 -10 L180 50 L230 20 L100 -40 Z" fill="#eeeeee" opacity="0.7"/>

        <!-- Bubbles -->
        <circle cx="110" cy="55" r="22" fill="#c54a5c" />
        <circle cx="102" cy="55" r="3" fill="white" />
        <circle cx="110" cy="55" r="3" fill="white" />
        <circle cx="118" cy="55" r="3" fill="white" />

        <circle cx="160" cy="15" r="18" fill="#c54a5c" />
        <circle cx="154" cy="15" r="2" fill="white" />
        <circle cx="160" cy="15" r="2" fill="white" />
        <circle cx="166" cy="15" r="2" fill="white" />

        <!-- Paper Plane -->
        <g transform="translate(220, -30) rotate(-15) scale(0.5)">
            <path d="M0 50 L100 0 L40 60 L0 50 Z" fill="white" />
            <path d="M100 0 L60 100 L40 60 L100 0 Z" fill="#f8f8f8" />
            <path d="M40 60 L60 100 L60 60 L40 60 Z" fill="#c54a5c" />
        </g>
    </g>

    <!-- App Name -->
    <text x="256" y="520" font-family="'Outfit', 'Inter', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#1e293b" letter-spacing="-2">BOXBI</text>
</svg>
