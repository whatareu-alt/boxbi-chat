name = "boxbi-chat"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "boxbi-db"
database_id = "REPLACE_WITH_D1_ID" # User will need to fill this after creating D1 via wrangler

[[durable_objects.bindings]]
name = "CHAT_DO"
class_name = "ChatDO"

[[migrations]]
tag = "v1"
new_classes = ["ChatDO"]

[vars]
JWT_SECRET = "super-secret-key"
